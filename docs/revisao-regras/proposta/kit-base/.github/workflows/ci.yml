# Kit base: integração contínua para soluções .NET
# Roda em todo push (qualquer branch). Sem PR obrigatório: o CI é o aviso de que algo quebrou (docs/padroes/git.md §3).
# Ajuste SOLUTION e TEST_PROJECTS por projeto.

name: ci

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true
  SOLUTION: Ofertio.sln
  # Projetos de teste que rodam no CI (o E2E depende de ambiente e fica de fora)
  TEST_PROJECTS: Ofertio.Tests/Ofertio.Tests.csproj

jobs:
  segredos:
    name: varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Usa .gitleaks.toml da raiz quando existir (allowlist de placeholders)

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: segredos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # fixa a versão do SDK; remova se o projeto não tiver global.json

      - name: Restaurar
        # O projeto MAUI (Mobile) exige workloads; fica fora do CI Linux por padrão
        run: dotnet restore $SOLUTION

      - name: Formatação
        # Etapa 7 do PLANO: começa com continue-on-error: true e vira bloqueante depois de um "dotnet format" geral
        run: dotnet format $SOLUTION --verify-no-changes --no-restore --verbosity minimal
        continue-on-error: true

      - name: Build
        run: dotnet build $SOLUTION -c Release --no-restore

      - name: Testes
        run: |
          for p in $TEST_PROJECTS; do
            dotnet test "$p" -c Release --no-build --logger "trx;LogFileName=$(basename $p .csproj).trx" --results-directory TestResults
          done

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults

      - name: Pacotes vulneráveis
        # Falha se houver vulnerabilidade High ou Critical (direta ou transitiva)
        run: |
          dotnet list $SOLUTION package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '\b(High|Critical)\b' vuln.txt; then
            echo "::error::Pacote com vulnerabilidade High/Critical. Veja o log acima."
            exit 1
          fi

      - name: Checagens de regra por busca
        # Regras simples que não têm analisador pronto. Cada linha falha o job se encontrar o padrão.
        # Padrão de .Result pode ter falso positivo (propriedade chamada Result): ajuste o regex ao projeto.
        run: |
          fail=0
          check() {
            msg="$1"; pattern="$2"; shift 2
            if git grep -nE "$pattern" -- "$@"; then echo "::error::$msg"; fail=1; fi
          }
          check "Proibido .Wait()/GetResult() em código de produção" '\.Wait\(\)|GetAwaiter\(\)\.GetResult\(\)' '*.cs' ':!*Tests*' ':!*E2E*'
          check "Proibido new HttpClient()" 'new HttpClient\(' '*.cs' ':!*Tests*'
          check "Proibido AllowAnyOrigin" 'AllowAnyOrigin\(' '*.cs'
          check "Proibido window.confirm/alert/prompt" 'window\.(confirm|alert|prompt)' '*.razor' '*.js' ':!**/lib/**'
          exit $fail
